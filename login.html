<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | MailMart</title>
<meta name="theme-color" content="#020812">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 10%,rgba(0,123,255,.18),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(0,215,255,.12),transparent 30%),
        #020812;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.35;
    background-image:
        linear-gradient(rgba(0,190,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,190,255,.035) 1px,transparent 1px);
    background-size:55px 55px;
}

.container{
    width:100%;
    max-width:1100px;
    min-height:650px;
    padding:30px;
    display:grid;
    grid-template-columns:1fr 430px;
    gap:70px;
    align-items:center;
    position:relative;
    z-index:1;
}

.left{
    padding:20px;
}

.logo{
    width:72px;
    height:72px;
    border-radius:20px;
    object-fit:cover;
    margin-bottom:25px;
    box-shadow:0 15px 45px rgba(0,160,255,.25);
}

.left h1{
    font-size:clamp(45px,6vw,72px);
    line-height:1;
    letter-spacing:-4px;
    margin-bottom:22px;
}

.gradient{
    background:linear-gradient(90deg,#fff,#39dfff,#087cff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.left p{
    max-width:550px;
    color:#8ea6bf;
    line-height:1.8;
    font-size:14px;
}

.services{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.service{
    padding:10px 13px;
    border-radius:12px;
    border:1px solid rgba(0,205,255,.14);
    background:rgba(0,120,255,.06);
    color:#9cb4ce;
    font-size:11px;
}

.card{
    padding:34px;
    border-radius:27px;
    background:linear-gradient(145deg,rgba(9,35,68,.95),rgba(3,13,27,.98));
    border:1px solid rgba(0,205,255,.18);
    box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.card h2{
    text-align:center;
    font-size:26px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#829ab4;
    font-size:12px;
    line-height:1.6;
    margin-bottom:25px;
}

.error,
.success{
    display:none;
    padding:12px;
    border-radius:10px;
    font-size:11px;
    line-height:1.5;
    margin-bottom:15px;
}

.error{
    color:#ff9bab;
    background:rgba(255,50,80,.08);
    border:1px solid rgba(255,50,80,.2);
}

.success{
    color:#70f0bd;
    background:rgba(0,220,150,.07);
    border:1px solid rgba(0,220,150,.18);
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    color:#b8cbe0;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
}

.field input{
    width:100%;
    height:50px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;
    background:rgba(0,0,0,.2);
    color:#fff;
    outline:none;
    padding:0 15px;
    font:inherit;
    font-size:13px;
}

.field input:focus{
    border-color:#08bfff;
    box-shadow:0 0 0 3px rgba(0,180,255,.08);
}

.field input::placeholder{
    color:#58718c;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:3px 0 20px;
    font-size:11px;
}

.remember{
    color:#8197af;
    display:flex;
    gap:7px;
    align-items:center;
}

.remember input{
    accent-color:#078cff;
}

.forgot{
    color:#28d9ff;
    cursor:pointer;
}

button{
    font-family:inherit;
}

.login-btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#087cff,#00d5ff);
    color:white;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(0,150,255,.25);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0;
    color:#607991;
    font-size:9px;
}

.divider:before,
.divider:after{
    content:"";
    height:1px;
    flex:1;
    background:rgba(255,255,255,.08);
}

.google-btn{
    width:100%;
    height:49px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    color:#e2edf8;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.25s;
}

.google-btn:hover{
    background:rgba(255,255,255,.08);
}

.register{
    text-align:center;
    color:#7288a1;
    font-size:11px;
    margin-top:23px;
}

.register a{
    color:#28d9ff;
    font-weight:700;
    text-decoration:none;
}

.home{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#627b94;
    font-size:10px;
    text-decoration:none;
}

.home:hover{
    color:#fff;
}

.loading{
    display:none;
}

@media(max-width:850px){

    body{
        align-items:flex-start;
    }

    .container{
        grid-template-columns:1fr;
        gap:25px;
        max-width:550px;
        padding:35px 18px;
    }

    .left{
        text-align:center;
        padding:10px;
    }

    .left p{
        margin:auto;
    }

    .services{
        justify-content:center;
    }

    .logo{
        width:60px;
        height:60px;
        border-radius:17px;
    }

}

@media(max-width:500px){

    .container{
        padding:25px 13px;
    }

    .left{
        padding:5px;
    }

    .left h1{
        font-size:43px;
        letter-spacing:-3px;
    }

    .left p{
        font-size:12px;
    }

    .card{
        padding:24px 18px;
        border-radius:21px;
    }

    .card h2{
        font-size:22px;
    }

}

@media(max-width:360px){

    .left h1{
        font-size:37px;
    }

    .card{
        padding:22px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <section class="left">

        <img
            class="logo"
            src="https://res.cloudinary.com/wfcrf1ps/image/upload/f_auto,q_auto,w_300/v1786979320/WhatsApp_Image_2026-08-16_at_11.41.57_PM.jpg"
            alt="MailMart"
        >

        <h1>
            Welcome to<br>
            <span class="gradient">MailMart.</span>
        </h1>

        <p>
            Your digital marketplace for social media services,
            digital solutions and email purchasing.
        </p>

        <div class="services">
            <span class="service">Social Media</span>
            <span class="service">Digital Services</span>
            <span class="service">Email Purchasing</span>
            <span class="service">Fast Delivery</span>
        </div>

    </section>

    <section class="card">

        <h2>Sign In</h2>

        <p class="subtitle">
            Login to your MailMart account.
        </p>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <form id="loginForm">

            <div class="field">
                <label>Email Address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <span class="forgot" id="forgot">
                    Forgot password?
                </span>

            </div>

            <button
                class="login-btn"
                id="loginBtn"
                type="submit"
            >
                <span id="loginText">Login</span>
                <span id="loginLoading" class="loading">
                    Signing in...
                </span>
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <button
            class="google-btn"
            id="googleBtn"
            type="button"
        >
            Continue with Google
        </button>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create an account</a>
        </div>

        <a href="index.html" class="home">
            ← Back to home
        </a>

    </section>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCc-0Gtmh7dIFWgnWglIQfjq-PlJu07IKE",

    authDomain:
        "mailmartz.firebaseapp.com",

    projectId:
        "mailmartz",

    storageBucket:
        "mailmartz.firebasestorage.app",

    messagingSenderId:
        "802413654231",

    appId:
        "1:802413654231:web:4e5d87d23d6a2317724092",

    measurementId:
        "G-LKLEWS7RPF"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
    prompt:"select_account"
});


const form =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const remember =
    document.getElementById("remember");

const loginBtn =
    document.getElementById("loginBtn");

const loginText =
    document.getElementById("loginText");

const loginLoading =
    document.getElementById("loginLoading");

const googleBtn =
    document.getElementById("googleBtn");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const forgot =
    document.getElementById("forgot");


function showError(text){

    errorBox.textContent = text;
    errorBox.style.display = "block";

    successBox.style.display = "none";

}


function showSuccess(text){

    successBox.textContent = text;
    successBox.style.display = "block";

    errorBox.style.display = "none";

}


function clearMessages(){

    errorBox.style.display = "none";
    successBox.style.display = "none";

}


function firebaseError(error){

    switch(error.code){

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/user-not-found":
            return "No account exists with this email.";

        case "auth/wrong-password":
            return "Incorrect email or password.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-disabled":
            return "This account has been disabled.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        case "auth/popup-closed-by-user":
            return "Google sign-in was cancelled.";

        case "auth/popup-blocked":
            return "Your browser blocked the Google sign-in window.";

        case "auth/operation-not-allowed":
            return "This sign-in method is not enabled in Firebase.";

        default:
            return "Unable to sign in. Please try again.";

    }

}


function loading(state){

    loginBtn.disabled = state;
    googleBtn.disabled = state;

    if(state){

        loginText.style.display = "none";
        loginLoading.style.display = "inline";

    }else{

        loginText.style.display = "inline";
        loginLoading.style.display = "none";

    }

}


async function setLoginPersistence(){

    await setPersistence(
        auth,
        remember.checked
            ? browserLocalPersistence
            : browserSessionPersistence
    );

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();

        const emailValue =
            email.value.trim();

        const passwordValue =
            password.value;

        if(!emailValue || !passwordValue){

            showError(
                "Please enter your email and password."
            );

            return;

        }

        loading(true);

        try{

            await setLoginPersistence();

            await signInWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );

            showSuccess(
                "Login successful. Redirecting..."
            );

            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }catch(error){

            showError(
                firebaseError(error)
            );

            loading(false);

        }

    }
);


googleBtn.addEventListener(
    "click",
    async function(){

        clearMessages();

        loading(true);

        try{

            await setLoginPersistence();

            await signInWithPopup(
                auth,
                provider
            );

            showSuccess(
                "Google login successful. Redirecting..."
            );

            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }catch(error){

            showError(
                firebaseError(error)
            );

            loading(false);

        }

    }
);


forgot.addEventListener(
    "click",
    async function(){

        clearMessages();

        const emailValue =
            email.value.trim();

        if(!emailValue){

            showError(
                "Enter your email address first."
            );

            email.focus();

            return;

        }

        try{

            await sendPasswordResetEmail(
                auth,
                emailValue
            );

            showSuccess(
                "Password reset instructions have been sent to your email."
            );

        }catch(error){

            showError(
                firebaseError(error)
            );

        }

    }
);

</script>

</body>
</html>
