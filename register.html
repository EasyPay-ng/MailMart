<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Register | MailMart</title>
<meta name="theme-color" content="#020812">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 0%,rgba(0,120,255,.17),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(0,210,255,.1),transparent 35%),
        #020812;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(0,190,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,190,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
}

.page{
    position:relative;
    z-index:1;
    width:100%;
    min-height:100vh;
    padding:30px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.wrapper{
    width:100%;
    max-width:1080px;
    display:grid;
    grid-template-columns:1fr 430px;
    gap:65px;
    align-items:center;
}

.brand-section{
    padding:20px;
}

.logo{
    width:68px;
    height:68px;
    border-radius:19px;
    object-fit:cover;
    display:block;
    margin-bottom:25px;
    box-shadow:0 15px 45px rgba(0,160,255,.25);
}

.brand-section h1{
    font-size:clamp(48px,6vw,72px);
    line-height:.98;
    letter-spacing:-4px;
    margin-bottom:22px;
}

.gradient{
    background:linear-gradient(90deg,#fff,#35ddff,#087cff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-section p{
    max-width:530px;
    color:#8ba3bd;
    font-size:14px;
    line-height:1.8;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:27px;
}

.tag{
    padding:9px 12px;
    border-radius:10px;
    background:rgba(0,130,255,.06);
    border:1px solid rgba(0,200,255,.13);
    color:#9bb2ca;
    font-size:10px;
}

.card{
    width:100%;
    padding:32px;
    border-radius:27px;
    background:
        linear-gradient(
            145deg,
            rgba(9,35,68,.96),
            rgba(3,13,27,.98)
        );
    border:1px solid rgba(0,205,255,.18);
    box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.card-header{
    text-align:center;
    margin-bottom:22px;
}

.card-logo{
    width:58px;
    height:58px;
    border-radius:16px;
    object-fit:cover;
    margin:0 auto 14px;
    display:block;
}

.card h2{
    font-size:24px;
    margin-bottom:7px;
}

.subtitle{
    color:#8198b1;
    font-size:11px;
    line-height:1.6;
}

.message{
    display:none;
    padding:11px 12px;
    border-radius:10px;
    margin-bottom:14px;
    font-size:10px;
    line-height:1.5;
}

.error{
    color:#ff9aa9;
    background:rgba(255,50,80,.08);
    border:1px solid rgba(255,50,80,.2);
}

.success{
    color:#69edb8;
    background:rgba(0,220,150,.07);
    border:1px solid rgba(0,220,150,.18);
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#b8cbe0;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
    width:100%;
}

.input-wrap input{
    display:block;
    width:100%;
    height:48px;
    padding:0 45px 0 14px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:11px;
    outline:none;
    background:rgba(0,0,0,.2);
    color:#fff;
    font-family:inherit;
    font-size:12px;
}

.input-wrap input:focus{
    border-color:#08bfff;
    box-shadow:0 0 0 3px rgba(0,180,255,.07);
}

.input-wrap input::placeholder{
    color:#58718c;
}

.eye{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    color:#6c839b;
    font-size:9px;
    cursor:pointer;
    user-select:none;
}

.eye:hover{
    color:#29d9ff;
}

.password-strength{
    width:100%;
    height:3px;
    margin-top:7px;
    border-radius:10px;
    overflow:hidden;
    background:rgba(255,255,255,.07);
}

.strength-bar{
    width:0;
    height:100%;
    transition:.25s;
}

.strength-text{
    display:block;
    min-height:12px;
    margin-top:4px;
    color:#647c95;
    font-size:8px;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin:15px 0 18px;
    color:#8197af;
    font-size:9px;
    line-height:1.5;
}

.terms input{
    flex:none;
    margin-top:2px;
    accent-color:#087cff;
}

.terms a{
    color:#28d9ff;
    text-decoration:none;
}

.register-btn{
    width:100%;
    height:49px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#087cff,#00d5ff);
    color:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.register-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(0,150,255,.25);
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
    color:#5e7690;
    font-size:8px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.08);
}

.google-btn{
    width:100%;
    height:47px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    color:#e2edf8;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

.google-btn:hover{
    background:rgba(255,255,255,.08);
}

.google-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login{
    text-align:center;
    margin-top:19px;
    color:#7188a1;
    font-size:10px;
}

.login a{
    color:#29d9ff;
    font-weight:700;
    text-decoration:none;
}

.home{
    display:block;
    text-align:center;
    margin-top:14px;
    color:#607891;
    font-size:9px;
    text-decoration:none;
}

.home:hover{
    color:#fff;
}

.loading{
    display:none;
}

@media(max-width:850px){

    .page{
        align-items:flex-start;
        padding:25px 16px 35px;
    }

    .wrapper{
        max-width:520px;
        display:block;
    }

    .brand-section{
        padding:10px 5px 24px;
        text-align:center;
    }

    .logo{
        width:55px;
        height:55px;
        border-radius:16px;
        margin:0 auto 15px;
    }

    .brand-section h1{
        font-size:42px;
        letter-spacing:-3px;
        margin-bottom:13px;
    }

    .brand-section p{
        max-width:430px;
        margin:auto;
        font-size:11px;
        line-height:1.65;
    }

    .tags{
        justify-content:center;
        margin-top:17px;
    }

    .tag{
        padding:7px 9px;
        font-size:8px;
    }

    .card{
        max-width:460px;
        margin:0 auto;
    }
}

@media(max-width:500px){

    .page{
        padding:16px 10px 25px;
    }

    .wrapper{
        width:100%;
    }

    .brand-section{
        padding:7px 4px 19px;
    }

    .logo{
        width:48px;
        height:48px;
        border-radius:14px;
        margin-bottom:12px;
    }

    .brand-section h1{
        font-size:34px;
        letter-spacing:-2px;
        margin-bottom:10px;
    }

    .brand-section p{
        padding:0 15px;
        font-size:10px;
    }

    .tags{
        gap:6px;
        margin-top:13px;
    }

    .tag{
        padding:6px 8px;
        font-size:7px;
        border-radius:8px;
    }

    .card{
        padding:23px 17px;
        border-radius:20px;
    }

    .card-logo{
        width:49px;
        height:49px;
        border-radius:14px;
        margin-bottom:11px;
    }

    .card h2{
        font-size:20px;
        margin-bottom:5px;
    }

    .subtitle{
        font-size:9px;
    }

    .card-header{
        margin-bottom:18px;
    }

    .field{
        margin-bottom:12px;
    }

    .field label{
        font-size:9px;
        margin-bottom:6px;
    }

    .input-wrap input{
        height:46px;
        font-size:11px;
        border-radius:10px;
    }

    .terms{
        margin:13px 0 16px;
        font-size:8px;
    }

    .register-btn{
        height:47px;
        font-size:11px;
    }

    .divider{
        margin:17px 0;
    }

    .google-btn{
        height:45px;
        font-size:10px;
    }

    .login{
        margin-top:16px;
    }

}

@media(max-width:360px){

    .page{
        padding-left:8px;
        padding-right:8px;
    }

    .brand-section h1{
        font-size:31px;
    }

    .brand-section p{
        font-size:9px;
    }

    .card{
        padding:20px 14px;
    }

    .input-wrap input{
        height:44px;
    }
}
</style>
</head>

<body>

<main class="page">

<div class="wrapper">

<section class="brand-section">

<img
class="logo"
src="https://res.cloudinary.com/wfcrf1ps/image/upload/f_auto,q_auto,w_300/v1786979320/WhatsApp_Image_2026-08-16_at_11.41.57_PM.jpg"
alt="MailMart"
>

<h1>
Join
<span class="gradient">MailMart.</span>
</h1>

<p>
Create your account and access MailMart's digital
marketplace, social media services and email purchasing.
</p>

<div class="tags">
<span class="tag">Social Media</span>
<span class="tag">Digital Services</span>
<span class="tag">We Buy Emails</span>
<span class="tag">Fast Service</span>
</div>

</section>

<section class="card">

<div class="card-header">

<img
class="card-logo"
src="https://res.cloudinary.com/wfcrf1ps/image/upload/f_auto,q_auto,w_200/v1786979320/WhatsApp_Image_2026-08-16_at_11.41.57_PM.jpg"
alt="MailMart"
>

<h2>Create Account</h2>

<p class="subtitle">
Register your MailMart account.
</p>

</div>

<div id="error" class="message error"></div>
<div id="success" class="message success"></div>

<form id="registerForm">

<div class="field">

<label>Email Address</label>

<div class="input-wrap">

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email"
required
>

</div>

</div>

<div class="field">

<label>Password</label>

<div class="input-wrap">

<input
id="password"
type="password"
placeholder="Create a password"
autocomplete="new-password"
minlength="6"
required
>

<span
class="eye"
id="passwordEye"
>
Show
</span>

</div>

<div class="password-strength">

<div
id="strengthBar"
class="strength-bar"
></div>

</div>

<span
id="strengthText"
class="strength-text"
></span>

</div>

<div class="field">

<label>Confirm Password</label>

<div class="input-wrap">

<input
id="confirmPassword"
type="password"
placeholder="Confirm your password"
autocomplete="new-password"
minlength="6"
required
>

<span
class="eye"
id="confirmEye"
>
Show
</span>

</div>

</div>

<label class="terms">

<input
type="checkbox"
id="terms"
required
>

<span>
I agree to the
<a href="#">Terms of Service</a>
and
<a href="#">Privacy Policy</a>.
</span>

</label>

<button
type="submit"
class="register-btn"
id="registerBtn"
>

<span id="registerText">
Create Account
</span>

<span
id="registerLoading"
class="loading"
>
Creating account...
</span>

</button>

</form>

<div class="divider">
OR
</div>

<button
type="button"
class="google-btn"
id="googleBtn"
>
Continue with Google
</button>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

<a
href="index.html"
class="home"
>
← Back to home
</a>

</section>

</div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={

apiKey:"AIzaSyCc-0Gtmh7dIFWgnWglIQfjq-PlJu07IKE",

authDomain:"mailmartz.firebaseapp.com",

projectId:"mailmartz",

storageBucket:"mailmartz.firebasestorage.app",

messagingSenderId:"802413654231",

appId:"1:802413654231:web:4e5d87d23d6a2317724092",

measurementId:"G-LKLEWS7RPF"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const provider=new GoogleAuthProvider();

provider.setCustomParameters({
prompt:"select_account"
});


const form=document.getElementById("registerForm");

const email=document.getElementById("email");

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

const terms=document.getElementById("terms");

const registerBtn=document.getElementById("registerBtn");

const registerText=document.getElementById("registerText");

const registerLoading=document.getElementById("registerLoading");

const googleBtn=document.getElementById("googleBtn");

const errorBox=document.getElementById("error");

const successBox=document.getElementById("success");

const passwordEye=document.getElementById("passwordEye");

const confirmEye=document.getElementById("confirmEye");

const strengthBar=document.getElementById("strengthBar");

const strengthText=document.getElementById("strengthText");


function errorMessage(error){

switch(error.code){

case"auth/email-already-in-use":
return"An account with this email already exists.";

case"auth/invalid-email":
return"Please enter a valid email address.";

case"auth/weak-password":
return"Password must contain at least 6 characters.";

case"auth/network-request-failed":
return"Network error. Check your internet connection.";

case"auth/popup-closed-by-user":
return"Google registration was cancelled.";

case"auth/popup-blocked":
return"Your browser blocked the Google sign-in window.";

case"auth/operation-not-allowed":
return"This sign-in method is not enabled in Firebase.";

default:
return"Unable to create your account. Please try again.";

}

}


function showError(text){

errorBox.textContent=text;

errorBox.style.display="block";

successBox.style.display="none";

}


function showSuccess(text){

successBox.textContent=text;

successBox.style.display="block";

errorBox.style.display="none";

}


function loading(state){

registerBtn.disabled=state;

googleBtn.disabled=state;

if(state){

registerText.style.display="none";

registerLoading.style.display="inline";

}else{

registerText.style.display="inline";

registerLoading.style.display="none";

}

}


function strength(value){

let score=0;

if(value.length>=6)score++;

if(value.length>=10)score++;

if(/[A-Z]/.test(value))score++;

if(/[0-9]/.test(value))score++;

if(/[^A-Za-z0-9]/.test(value))score++;


if(!value){

strengthBar.style.width="0";

strengthText.textContent="";

return;

}


if(score<=1){

strengthBar.style.width="25%";

strengthText.textContent="Weak password";

}else if(score<=3){

strengthBar.style.width="60%";

strengthText.textContent="Moderate password";

}else{

strengthBar.style.width="100%";

strengthText.textContent="Strong password";

}

}


password.addEventListener(
"input",
()=>strength(password.value)
);


passwordEye.addEventListener(
"click",
()=>{

if(password.type==="password"){

password.type="text";

passwordEye.textContent="Hide";

}else{

password.type="password";

passwordEye.textContent="Show";

}

}
);


confirmEye.addEventListener(
"click",
()=>{

if(confirmPassword.type==="password"){

confirmPassword.type="text";

confirmEye.textContent="Hide";

}else{

confirmPassword.type="password";

confirmEye.textContent="Show";

}

}
);


form.addEventListener(
"submit",
async(event)=>{

event.preventDefault();

errorBox.style.display="none";

successBox.style.display="none";


const emailValue=email.value.trim();

const passwordValue=password.value;

const confirmValue=confirmPassword.value;


if(passwordValue.length<6){

showError(
"Password must contain at least 6 characters."
);

return;

}


if(passwordValue!==confirmValue){

showError(
"Passwords do not match."
);

return;

}


if(!terms.checked){

showError(
"Please accept the Terms of Service and Privacy Policy."
);

return;

}


loading(true);


try{

await setPersistence(
auth,
browserLocalPersistence
);

await createUserWithEmailAndPassword(
auth,
emailValue,
passwordValue
);


showSuccess(
"Account created successfully. Redirecting..."
);


setTimeout(
()=>{

window.location.href="dashboard.html";

},
800
);


}catch(error){

showError(
errorMessage(error)
);

loading(false);

}

}
);


googleBtn.addEventListener(
"click",
async()=>{

errorBox.style.display="none";

successBox.style.display="none";

loading(true);


try{

await setPersistence(
auth,
browserLocalPersistence
);

await signInWithPopup(
auth,
provider
);


showSuccess(
"Google registration successful. Redirecting..."
);


setTimeout(
()=>{

window.location.href="dashboard.html";

},
800
);


}catch(error){

showError(
errorMessage(error)
);

loading(false);

}

}
);

</script>

</body>
</html>
