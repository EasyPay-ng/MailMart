<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js">
  </script>

  <style>
    /* ── Reset & Base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Auth Card ── */
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .auth-card h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: #555;
      margin-bottom: 24px;
    }

    .auth-card .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 40px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .auth-card .btn-google:hover {
      background: #f8f9fa;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .auth-card .btn-google img {
      width: 20px;
      height: 20px;
    }

    .auth-card .error-msg {
      color: #d32f2f;
      font-size: 0.9rem;
      margin-top: 16px;
      min-height: 1.4em;
    }

    .auth-card .divider {
      margin: 20px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #888;
      font-size: 0.85rem;
    }

    .auth-card .divider::before,
    .auth-card .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .email-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .email-form input {
      padding: 12px 16px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .email-form input:focus {
      border-color: #1a73e8;
    }

    .email-form .btn-email {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .email-form .btn-email:hover {
      background: #1557b0;
    }

    .email-form .toggle-link {
      background: none;
      border: none;
      color: #1a73e8;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .email-form .toggle-link:hover {
      text-decoration: underline;
    }

    /* ── Admin Panel ── */
    .admin-panel {
      display: none;
      width: 100%;
      max-width: 900px;
      padding: 24px;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .admin-header h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
    }

    .admin-header .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-header .user-info span {
      color: #555;
      font-size: 0.95rem;
    }

    .admin-header .btn-signout {
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .admin-header .btn-signout:hover {
      background: #f0f0f0;
    }

    /* Admin Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 0.95rem;
      color: #777;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .admin-card {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .admin-card h2 {
      font-size: 1.2rem;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    .admin-card p {
      color: #555;
      line-height: 1.6;
    }

    .admin-card .btn-action {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 12px;
    }

    .admin-card .btn-action:hover {
      background: #1557b0;
    }

    /* ── Access Denied ── */
    .access-denied {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }

    .access-denied.active {
      display: block;
    }

    .access-denied h1 {
      font-size: 1.8rem;
      color: #d32f2f;
      margin-bottom: 12px;
    }

    .access-denied p {
      color: #555;
      margin-bottom: 24px;
    }

    .access-denied .btn-signout {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* ── Loader ── */
    .loader {
      border: 4px solid #e0e0e0
